experiment_name: align_pareto_m2_sft_dpo
seed: 42
model:
  # Pretrained only (no chat or safety training). Stage 1 (SFT) makes it a helpful-only chat model (lambda = 0);
  # stage 2 (DPO) adds the safety alignment (lambda = 1).
  base_model_name: Qwen/Qwen3-0.6B-Base
  # Chat template and <|im_end|> end-of-reply token; same vocabulary as the base model
  tokenizer_name: Qwen/Qwen3-0.6B
  enable_thinking: false              # Qwen3 chat template; must match configs/evaluation.yaml
  # Full-precision weights, fp16 autocast during training. A 0.6B model fits a T4 without 4-bit quantization,
  # so the SFT adapter merges exactly and M3 / Group B evaluate the same unquantized weights.
  dtype: float32
lora:                                 # same adapter shape for both stages
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  task_type: CAUSAL_LM
sft:
  # Human-written helpful replies with refusal-like replies removed (src/alignment/sft_data.py), so lambda = 0
  # answers and writes but has no safety training. Counts are maxima per source.
  train_examples:
    no_robots: 9000                   # all usable (~8.6k after dropping system-prompt and refusal-like examples)
    oasst2: 6000                      # best-ranked English replies
  eval_examples:                      # from each source's held-out split
    no_robots: 200
    oasst2: 200
  learning_rate: 2.0e-04
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8      # effective batch 16
  max_length: 1024                    # these replies are long; longer examples are dropped, not truncated
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 100
  save_steps: 200
dpo:
  dataset: Anthropic/hh-rlhf          # chosen vs rejected; no fallback dataset
  # Mostly harmlessness (the safety alignment), plus helpfulness pairs so the model learns to refuse only harmful
  # requests: harmless-base alone (v2) taught it to refuse almost everything.
  train_pairs:
    harmless-base: 3500
    helpful-base: 1500
  eval_pairs:
    harmless-base: 200
    helpful-base: 100
  beta: 0.1
  loss_type: sigmoid
  learning_rate: 5.0e-05
  num_train_epochs: 1                 # v2: eval loss was lowest at the end of epoch 1; epoch 2 overfit
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_length: 512                     # pairs longer than this are dropped, not truncated
  max_prompt_length: 256
  warmup_ratio: 0.1
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
smoke_test:
  prompts_per_quadrant: 4             # from the validation split of data/eval/eval_prompts.csv
  max_new_tokens: 200
  temperature: 0.8                    # same sampling as M3 (configs/evaluation.yaml), seeded, so replies are repeatable
  top_p: 0.95
  seed: 0
quick_test:
  # Used by `run_m2(quick=True)` for smoke tests only; never for reported results.
  train_examples: 32
  eval_examples: 8
  max_steps: 3
  max_length: 256
  max_prompt_length: 128
lambda_interpolation:
  formula: W_lambda = W_sft + lambda * (alpha / r) * (B @ A)
  default_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
